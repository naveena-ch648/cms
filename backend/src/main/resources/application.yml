spring:
  application:
    name: cms-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: jdbc:mysql://localhost:3307/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=10m

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

jwt:
  secret: change-me-in-production-use-a-long-random-secret-key-at-least-256-bits
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  port: 8080

minio:
  enabled: false

pg:
  host: ${PG_HOST:localhost}
  port: ${PG_PORT:5433}
  db: ${PG_DB:cms_app}
  user: ${PG_USER:cmsuser}
  password: ${PG_PASSWORD:cmspassword}

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: http
  index-name: cms_files

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  collection-name: document_chunks

llm:
  provider: ${LLM_PROVIDER:openai}
  openai:
    api-key: ${OPENAI_API_KEY:openai-api-key}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.1
    max-tokens: 1024
  embedding:
    model: ${EMBEDDING_MODEL:all-MiniLM-L6-v2}
    dimension: ${EMBEDDING_DIMENSION:384}

file-upload:
  max-single-upload-size: 104857600
  default-chunk-size: 5242880
  session-ttl-hours: 24
  max-concurrent-chunks: 3

google:
  drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:not-set}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:not-set}
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/google-drive/callback}

integration:
  encryption-key: ${INTEGRATION_ENCRYPTION_KEY:dGVzdC1rZXktZm9yLWRldi1vbmx5LTMyYnl0ZXM=}

logging:
  level:
    com.cms: DEBUG
    org.springframework.security: INFO

email:
  digest:
    from: ${EMAIL_FROM:noreply@cms.local}
    base-url: ${APP_BASE_URL:http://localhost:3000}

two-factor:
  issuer: ${TWO_FACTOR_ISSUER:CMS Platform}
  email-otp-ttl-seconds: 300
