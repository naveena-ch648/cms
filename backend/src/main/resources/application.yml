spring:
  application:
    name: cms-backend

  datasource:
    url: jdbc:mysql://localhost:3307/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cmsuser
    password: cmspassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: change-me-in-production-use-a-long-random-secret-key-at-least-256-bits
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  port: 8080

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: http
  index-name: cms_files

file-upload:
  max-single-upload-size: 104857600
  default-chunk-size: 5242880
  session-ttl-hours: 24
  max-concurrent-chunks: 3

logging:
  level:
    com.cms: DEBUG
    org.springframework.security: INFO
