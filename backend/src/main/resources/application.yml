spring:
  application:
    name: cms-backend

  datasource:
    url: jdbc:mysql://localhost:3307/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cmsuser
    password: cmspassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: change-me-in-production-use-a-long-random-secret-key-at-least-256-bits
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  port: 8080

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  region: us-east-1

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: http
  index-name: cms_files

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  collection-name: document_chunks

llm:
  provider: ${LLM_PROVIDER:openai}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.1
    max-tokens: 1024
  embedding:
    model: ${EMBEDDING_MODEL:all-MiniLM-L6-v2}
    dimension: ${EMBEDDING_DIMENSION:384}

file-upload:
  max-single-upload-size: 104857600
  default-chunk-size: 5242880
  session-ttl-hours: 24
  max-concurrent-chunks: 3

google:
  drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:not-set}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:not-set}
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/google-drive/callback}

integration:
  encryption-key: ${INTEGRATION_ENCRYPTION_KEY:dGVzdC1rZXktZm9yLWRldi1vbmx5LTMyYnl0ZXM=}

logging:
  level:
    com.cms: DEBUG
    org.springframework.security: INFO
